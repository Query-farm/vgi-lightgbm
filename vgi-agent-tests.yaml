# Private graders for vgi-lint simulate / lint (VGI416). The worker publishes only
# task names and prompts in vgi.agent_test_tasks; these reference queries stay local.
tasks:
- name: iris_species_balance
  reference_sql: >-
    SELECT target_name, count(*) AS n FROM lightgbm.main.iris GROUP BY target_name ORDER BY target_name

- name: wine_sample_count
  reference_sql: SELECT count(*) AS n FROM lightgbm.main.wine

- name: breast_cancer_cv_accuracy
  reference_sql: >-
    SELECT round(avg(score), 4) AS mean_cv_accuracy FROM lightgbm.main.cross_val_score((SELECT * EXCLUDE
    (sample_id, target_name) FROM lightgbm.main.breast_cancer), estimator := 'lgbm_classifier', target
    := 'target', cv := 5)

- name: california_housing_priciest_latitude
  reference_sql: >-
    SELECT round(latitude) AS lat FROM lightgbm.main.california_housing GROUP BY lat ORDER BY avg(median_house_value)
    DESC, lat LIMIT 1

- name: diabetes_train_rmse
  reference_sql:
  - >-
    SET VARIABLE diab_model = (SELECT model FROM lightgbm.main.fit((SELECT * FROM lightgbm.main.diabetes),
    estimator := 'lgbm_regressor', target := 'progression', id := 'sample_id'))
  - >-
    SELECT round(sqrt(avg((p.prediction - d.progression) * (p.prediction - d.progression))), 2) AS train_rmse
    FROM lightgbm.main.predict((SELECT * FROM lightgbm.main.diabetes), model := getvariable('diab_model'),
    id := 'sample_id') p JOIN lightgbm.main.diabetes d USING (sample_id)

- name: iris_oof_accuracy
  reference_sql: >-
    SELECT round(avg((p.prediction = i.target)::INT), 4) AS oof_accuracy FROM lightgbm.main.cross_val_predict((SELECT
    * EXCLUDE (target_name) FROM lightgbm.main.iris), estimator := 'lgbm_classifier', target := 'target',
    id := 'sample_id', cv := 5) p JOIN lightgbm.main.iris i USING (sample_id)

- name: iris_grid_search_best_accuracy
  reference_sql: >-
    SELECT round(max(mean_score), 4) AS best_cv_accuracy FROM lightgbm.main.grid_search((SELECT * EXCLUDE
    (target_name) FROM lightgbm.main.iris), target := 'target', id := 'sample_id', cv := 5, estimator
    := 'lgbm_classifier', num_leaves := [7, 15, 31], learning_rate := [0.05, 0.1])

- name: iris_randomized_search_combos
  reference_sql: >-
    SELECT count(*) AS n_combos FROM lightgbm.main.randomized_search((SELECT * EXCLUDE (target_name) FROM
    lightgbm.main.iris), target := 'target', id := 'sample_id', cv := 3, n_iter := 4, search_seed := 42,
    estimator := 'lgbm_classifier', num_leaves := [7, 15, 31, 63], learning_rate := [0.03, 0.05, 0.1,
    0.2])

- name: fit_lgbm_classifier_summary
  reference_sql: >-
    SELECT n_samples, n_features FROM lightgbm.main.fit_lgbm_classifier((SELECT * EXCLUDE (target_name)
    FROM lightgbm.main.iris), target := 'target', id := 'sample_id')

- name: fit_lgbm_regressor_summary
  reference_sql: >-
    SELECT n_samples, n_features FROM lightgbm.main.fit_lgbm_regressor((SELECT * FROM lightgbm.main.diabetes),
    target := 'progression', id := 'sample_id', n_estimators := 50)

- name: diabetes_top_gain_feature
  reference_sql:
  - >-
    SET VARIABLE gain_model = (SELECT model FROM lightgbm.main.fit((SELECT * FROM lightgbm.main.diabetes),
    estimator := 'lgbm_regressor', target := 'progression', id := 'sample_id'))
  - >-
    SELECT feature FROM lightgbm.main.feature_importance('', model := getvariable('gain_model'), importance_type
    := 'gain') ORDER BY rank, feature LIMIT 1

- name: diabetes_top_shap_feature
  reference_sql:
  - >-
    SET VARIABLE shap_model = (SELECT model FROM lightgbm.main.fit((SELECT * FROM lightgbm.main.diabetes),
    estimator := 'lgbm_regressor', target := 'progression', id := 'sample_id'))
  - >-
    SELECT feature FROM lightgbm.main.explain((SELECT * FROM lightgbm.main.diabetes), model := getvariable('shap_model'),
    id := 'sample_id') GROUP BY feature ORDER BY avg(abs(shap_value)) DESC, feature LIMIT 1

- name: diabetes_top_permutation_feature
  reference_sql:
  - >-
    SET VARIABLE perm_model = (SELECT model FROM lightgbm.main.fit((SELECT * FROM lightgbm.main.diabetes),
    estimator := 'lgbm_regressor', target := 'progression', id := 'sample_id'))
  - >-
    SELECT feature FROM lightgbm.main.permutation_importance((SELECT * FROM lightgbm.main.diabetes), model
    := getvariable('perm_model'), target := 'progression', random_state := 42, n_repeats := 5) ORDER BY
    rank, feature LIMIT 1

- name: bmi_partial_dependence_range
  reference_sql:
  - >-
    SET VARIABLE pd_model = (SELECT model FROM lightgbm.main.fit((SELECT * FROM lightgbm.main.diabetes),
    estimator := 'lgbm_regressor', target := 'progression', id := 'sample_id'))
  - >-
    SELECT round(min(partial_dependence), 2) AS min_pd, round(max(partial_dependence), 2) AS max_pd FROM
    lightgbm.main.partial_dependence((SELECT * FROM lightgbm.main.diabetes), model := getvariable('pd_model'),
    feature := 'bmi', grid_resolution := 20)

- name: registry_roundtrip
  reference_sql:
  - >-
    SELECT model_name FROM lightgbm.main.fit((SELECT * EXCLUDE (target_name) FROM lightgbm.main.iris),
    model_name := 'agent_iris_demo', estimator := 'lgbm_classifier', target := 'target', id := 'sample_id')
  - SELECT estimator, task FROM lightgbm.main.model_info('agent_iris_demo')
  check_sql: >-
    SELECT count(*) = 1 FROM lightgbm.main.models WHERE model_name = 'agent_iris_demo'

- name: registry_listing_after_drop
  reference_sql:
  - >-
    SELECT model_name FROM lightgbm.main.fit((SELECT * EXCLUDE (target_name) FROM lightgbm.main.iris),
    model_name := 'agent_scratch_model', estimator := 'lgbm_classifier', target := 'target', id := 'sample_id')
  - SELECT deleted FROM lightgbm.main.drop_model('agent_scratch_model')
  - >-
    SELECT count(*) AS remaining FROM lightgbm.main.models WHERE model_name = 'agent_scratch_model'

- name: make_classification_class_balance
  reference_sql: >-
    SELECT target, count(*) AS n FROM lightgbm.main.make_classification(n_samples := 120, n_features :=
    4, n_classes := 3, random_state := 42) GROUP BY target ORDER BY target

- name: make_regression_spread
  reference_sql: >-
    SELECT count(*) AS n, round(stddev(target), 2) AS sd_target FROM lightgbm.main.make_regression(n_samples
    := 90, n_features := 3, noise := 5.0, random_state := 42)

- name: breast_cancer_oof_missed_malignant
  reference_sql: >-
    SELECT count(*) AS missed_malignant FROM lightgbm.main.cross_val_predict((SELECT * EXCLUDE (target_name)
    FROM lightgbm.main.breast_cancer), estimator := 'lgbm_classifier', target := 'target', id := 'sample_id',
    cv := 5) p JOIN lightgbm.main.breast_cancer b USING (sample_id) WHERE b.target_name = 'malignant' AND
    p.prediction <> b.target
